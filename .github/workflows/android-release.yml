name: Build & Release Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create Mock Keystore for Build if not provided
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass android \
              -keypass android \
              -dname "CN=StackBall, OU=Game, O=AIStudio, L=MountainView, ST=CA, C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle :app:assembleRelease

      - name: Build Android App Bundle (AAB)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle :app:bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StackBall-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: StackBall-Release-Bundle
          path: app/build/outputs/bundle/release/*.aab
